<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRUTAL</title>
  <style>
    /* ---- Réglages de base ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0f;
      color: #f5f5f5;
      overflow: hidden;
    }

    /* Le body centre le canvas du jeu */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- Le canvas du jeu (caché tant qu'on n'a pas cliqué Play) ---- */
    canvas {
      image-rendering: pixelated;   /* pixels nets, jamais de flou */
      background: #14110f;
    }

    [hidden] { display: none !important; }

    /* ---- L'écran de titre, par-dessus tout ---- */
    .ecran-titre {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(220, 38, 38, 0.25), transparent 60%),
        #0a0a0f;
    }

    .titre {
      font-size: clamp(3.5rem, 18vw, 11rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #ff4d4d 55%, #b91c1c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(239, 68, 68, 0.35);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    .sous-titre {
      margin-top: 0.5rem;
      font-size: clamp(0.9rem, 3.5vw, 1.3rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .bouton {
      margin-top: 3rem;
      padding: 1rem 3.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .bouton:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(239, 68, 68, 0.6);
    }

    .bouton:active { transform: translateY(0); }

    .aide {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #6b7280;
      letter-spacing: 0.05em;
    }

    .pied {
      position: absolute;
      bottom: 1.2rem;
      font-size: 0.8rem;
      color: #4b5563;
      letter-spacing: 0.1em;
    }

    /* ---- Le HUD : vie / or / équipement, en haut à gauche ---- */
    .hud {
      position: fixed;
      left: 12px;
      top: 12px;
      padding: 8px 12px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      color: #e5e7eb;
      background: rgba(10, 10, 15, 0.75);
      border: 1px solid #374151;
      border-radius: 6px;
    }

    /* ---- Le menu pause (touche Échap) ---- */
    .menu {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 8, 0.72);
      z-index: 10;
    }

    .menu-panneau {
      width: min(460px, 92vw);
      padding: 28px 26px 20px;
      background: #14121a;
      border: 1px solid #3b2030;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .menu-titre {
      margin: 0 0 18px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f3f4f6;
    }

    .menu-continuer {
      width: 100%;
      margin-bottom: 18px;
      padding: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .menu-continuer:disabled { opacity: 0.4; cursor: default; }

    .menu-slots { display: flex; flex-direction: column; gap: 10px; }

    .menu-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #1d1b25;
      border: 1px solid #2c2a36;
      border-radius: 8px;
    }

    .menu-slot-info { display: flex; flex-direction: column; text-align: left; }
    .menu-slot-nom { font-weight: 700; font-size: 0.95rem; color: #e5e7eb; }
    .menu-slot-resume {
      white-space: pre-line;
      font-size: 0.76rem;
      line-height: 1.4;
      color: #9ca3af;
    }

    .menu-slot-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .menu-slot-actions button {
      padding: 7px 14px;
      font-weight: 600;
      color: #f3f4f6;
      background: #2f2d3a;
      border: 1px solid #45424f;
      border-radius: 6px;
      cursor: pointer;
    }
    .menu-slot-actions button:hover { background: #3b3947; }
    .menu-slot-actions button:disabled { opacity: 0.35; cursor: default; }

    .menu-aide {
      margin-top: 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    /* ---- Le choix au démarrage (sur l'écran de titre) ---- */
    .demarrage {
      width: min(460px, 92vw);
      margin-top: 2.4rem;
    }

    /* ---- Le fondu au noir (transitions entre zones) ---- */
    .fondu {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 17;
    }

    /* ---- Le flash de combat (façon FF9) ---- */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 18;
    }
    .flash.actif { animation: clignote 0.7s steps(1, end); }

    @keyframes clignote {
      0%   { opacity: 0.95; }
      14%  { opacity: 0; }
      28%  { opacity: 0.95; }
      42%  { opacity: 0; }
      56%  { opacity: 0.85; }
      100% { opacity: 0; }
    }

    /* ---- Les messages furtifs (points d'intérêt, infos de zone) ---- */
    .message-zone {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%) translateY(8px);
      padding: 10px 18px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 14px;
      color: #f3f4f6;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid #4b5563;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 15;
    }
    .message-zone.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---- L'écran de combat ---- */
    /* Conteneur transparent : la scène (canvas) reste visible derrière,
       seuls les contrôles (barre du bas, panneau de fin) captent la souris. */
    .combat {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
    }

    .combat-barre {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      padding: 14px 16px 18px;
      background: linear-gradient(0deg, rgba(8, 6, 5, 0.92), transparent);
      pointer-events: auto;
    }

    /* La jauge de Chaleur de Forge, à gauche des cartes */
    .combat-jauge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 78px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      color: #ffcaa0;
    }
    .combat-jauge-valeur { font-size: 1.5rem; font-weight: 800; }
    .combat-jauge-titre {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b88;
    }

    .combat-main { display: flex; gap: 10px; }

    .combat-carte {
      display: flex;
      flex-direction: column;
      width: 116px;
      height: 150px;
      padding: 10px;
      text-align: left;
      color: #f3efe7;
      background: #20262e;
      border: 1px solid #3a4450;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .combat-carte:hover:not(:disabled) {
      transform: translateY(-8px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }
    .combat-carte:disabled { opacity: 0.42; cursor: default; }
    .combat-carte--attaque { border-color: #7a3b32; background: #2a211f; }
    .combat-carte--defense { border-color: #2f5066; background: #1d2630; }

    .combat-carte-cout {
      align-self: flex-end;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      color: #1a1208;
      background: #ffb454;
      border-radius: 50%;
    }
    .combat-carte-nom {
      margin-top: 6px;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .combat-carte-texte {
      margin-top: auto;
      font-size: 0.74rem;
      line-height: 1.35;
      color: #b9c2cc;
    }

    .combat-fin {
      padding: 12px 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      background: linear-gradient(135deg, #b45309, #7c2d12);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .combat-fin:disabled { opacity: 0.4; cursor: default; }

    /* L'élément sélectionné au clavier (carte ou bouton) */
    .combat-carte.sel, .combat-fin.sel {
      outline: 3px solid #ffcf57;
      outline-offset: 2px;
      box-shadow: 0 0 18px rgba(255, 180, 60, 0.55);
    }
    .combat-carte.sel { transform: translateY(-8px); }

    /* Le panneau Victory / Defeat */
    .combat-resultat {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: rgba(6, 5, 8, 0.55);
      pointer-events: auto;
    }
    .combat-resultat-texte {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #f5f5f5;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    }
    #combat-continuer {
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ---- L'invite « parler » (près d'un PNJ) ---- */
    .invite {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      padding: 7px 16px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      color: #f3f4f6;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid #5b4636;
      border-radius: 999px;
      pointer-events: none;
      z-index: 8;
    }

    /* ---- Les dialogues (PNJ) ---- */
    .dialogue {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(5, 5, 8, 0.45);
      z-index: 20;
    }
    .dialogue-boite {
      width: min(640px, 94vw);
      margin-bottom: 5vh;
      padding: 18px 20px 14px;
      background: #14121a;
      border: 1px solid #3b2030;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .dialogue-nom {
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: #ff8a5b;
      margin-bottom: 8px;
    }
    .dialogue-texte {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #f3f4f6;
      min-height: 2.2em;
    }
    .dialogue-choix { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .dialogue-option {
      padding: 9px 12px;
      font-size: 0.98rem;
      color: #cbd0d6;
      background: #1d1b25;
      border: 1px solid #2c2a36;
      border-radius: 8px;
      cursor: pointer;
      white-space: pre;
    }
    .dialogue-option.sel {
      color: #fff;
      background: #3a2030;
      border-color: #b45309;
    }
    .dialogue-aide {
      margin-top: 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #6b7280;
      text-align: right;
    }

    /* ---- L'inventaire (touche B) ---- */
    .inventaire {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(5, 5, 8, 0.72);
      z-index: 16;
    }
    .inv-panneau {
      width: min(420px, 94vw);
      max-height: 94vh;
      overflow: auto;
      padding: 16px 18px 18px;
      background: #14121a;
      border: 1px solid #3b2030;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .inv-entete { display: flex; align-items: center; justify-content: space-between; }
    .inv-titre { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .inv-or-boite { color: #ffcf57; font-weight: 700; font-family: ui-monospace, monospace; }
    #inv-fermer {
      padding: 4px 12px; color: #f3f4f6; background: #2f2d3a;
      border: 1px solid #45424f; border-radius: 6px; cursor: pointer; font-weight: 700;
    }
    .inv-soustitre { margin: 14px 0 8px; font-size: 0.72rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: #8b8f98; }

    /* La fiche : slots à gauche · héros au centre · slots à droite */
    .inv-perso { display: flex; justify-content: center; align-items: flex-start; gap: 12px; margin-top: 12px; }
    .inv-colonne { display: flex; flex-direction: column; gap: 8px; }
    .inv-centre { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; }
    #inv-hero {
      background: radial-gradient(circle at 50% 40%, #211c2a, #0c0a12);
      border: 1px solid #2c2a36; border-radius: 8px;
      image-rendering: pixelated;
    }
    .inv-armes { display: flex; gap: 8px; }

    .inv-slot {
      position: relative;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: #1d1b25; border: 1px dashed #3a3744; border-radius: 6px;
      font-size: 0.56rem; color: #6b7280; padding: 2px;
    }

    /* Les stats, sous le héros */
    .inv-stats {
      width: 100%; margin-top: 2px;
      background: #100e16; border: 1px solid #2c2a36; border-radius: 8px;
      padding: 8px 12px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.82rem;
    }
    .inv-stat { display: flex; justify-content: space-between; padding: 2px 0; color: #b9c2cc; }
    .inv-stat b { color: #fff; }

    /* Le sac : grille de cases */
    .inv-grille {
      position: relative; margin: 0 auto;
      background-color: #14121a;
      background-image:
        linear-gradient(#2c2a36 1px, transparent 1px),
        linear-gradient(90deg, #2c2a36 1px, transparent 1px);
      background-size: 34px 34px;
      border: 1px solid #2c2a36;
    }

    /* Une icône d'item (placeholder coloré + bordure de rareté) */
    .inv-item {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      border: 2px solid #9aa0a6; border-radius: 5px; cursor: pointer; overflow: hidden;
    }
    .inv-item span {
      font-size: 0.5rem; line-height: 1.05; font-weight: 700;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); padding: 2px; text-align: center;
    }
    .inv-item:hover { filter: brightness(1.15); }
    .inv-aide { margin-top: 12px; font-size: 0.72rem; color: #6b7280; text-align: center; }

    /* ---- Contrôles tactiles (test mobile uniquement) ---- */
    .tactile { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
    .tac-b {
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 800; color: #f3f4f6;
      background: rgba(20, 18, 26, 0.55);
      border: 1px solid rgba(180, 160, 140, 0.4);
      border-radius: 12px;
      user-select: none; -webkit-user-select: none; touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tac-b:active { background: rgba(180, 83, 9, 0.6); }
    .tac-dpad {
      position: absolute; left: 18px; bottom: 22px;
      display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 5px;
    }
    .tac-haut   { grid-column: 2; grid-row: 1; }
    .tac-gauche { grid-column: 1; grid-row: 2; }
    .tac-droite { grid-column: 3; grid-row: 2; }
    .tac-bas    { grid-column: 2; grid-row: 3; }
    .tac-actions { position: absolute; right: 22px; bottom: 30px; display: flex; align-items: center; gap: 16px; }
    .tac-a, .tac-bag { width: 66px; height: 66px; border-radius: 50%; }
    .tac-menu { position: absolute; right: 16px; top: 16px; width: 46px; height: 46px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <!-- L'écran du jeu : 640x360 pixels internes, agrandi sans flou -->
  <canvas id="jeu" width="640" height="360" hidden></canvas>

  <!-- Le HUD : interface en HTML par-dessus le canvas -->
  <div class="hud" id="hud" hidden>
    <div id="hud-pv"></div>
    <div id="hud-or"></div>
    <div id="hud-arme"></div>
    <div id="hud-armure"></div>
    <div style="color:#6b7280">[B] Inventory</div>
  </div>

  <!-- Le fondu au noir (transitions entre zones) -->
  <div class="fondu" id="fondu"></div>

  <!-- Le flash de combat -->
  <div class="flash" id="flash"></div>

  <!-- Les messages furtifs (points d'intérêt…) -->
  <div class="message-zone" id="message-zone"></div>

  <!-- L'écran de combat : la scène est dessinée dans le canvas,
       les cartes et boutons sont posés par-dessus -->
  <div class="combat" id="combat" hidden>
    <div class="combat-barre">
      <div class="combat-main" id="combat-main"></div>
      <button class="combat-fin" id="combat-fin">End Turn</button>
    </div>

    <div class="combat-resultat" id="combat-resultat" hidden>
      <span class="combat-resultat-texte" id="combat-resultat-texte"></span>
      <button id="combat-continuer">Continue</button>
    </div>
  </div>

  <!-- L'invite « parler » près d'un PNJ -->
  <div class="invite" id="invite" hidden>[Space] Talk</div>

  <!-- Les dialogues (PNJ) : texte + choix, navigables au clavier -->
  <div class="dialogue" id="dialogue" hidden>
    <div class="dialogue-boite">
      <div class="dialogue-nom" id="dialogue-nom"></div>
      <p class="dialogue-texte" id="dialogue-texte"></p>
      <div class="dialogue-choix" id="dialogue-choix"></div>
      <div class="dialogue-aide" id="dialogue-aide"></div>
    </div>
  </div>

  <!-- La fiche de personnage / inventaire (touche B) -->
  <div class="inventaire" id="inventaire" hidden>
    <div class="inv-panneau">
      <div class="inv-entete">
        <span class="inv-titre">Character</span>
        <span class="inv-or-boite">🪙 <span id="inv-or">0</span></span>
        <button id="inv-fermer">✕</button>
      </div>
      <div class="inv-perso">
        <div class="inv-colonne" id="inv-gauche"></div>
        <div class="inv-centre">
          <canvas id="inv-hero" width="140" height="150"></canvas>
          <div class="inv-armes" id="inv-armes"></div>
          <div class="inv-stats" id="inv-stats"></div>
        </div>
        <div class="inv-colonne" id="inv-droite"></div>
      </div>
      <div class="inv-soustitre">Bag</div>
      <div class="inv-grille" id="inv-grille"></div>
      <p class="inv-aide">Click a bag item to equip · click an equipped item to remove · [B] to close</p>
    </div>
  </div>

  <!-- Contrôles tactiles (test mobile uniquement ; cachés sur PC) -->
  <div class="tactile" id="tactile" hidden>
    <div class="tac-dpad">
      <button class="tac-b tac-haut"   data-code="ArrowUp">▲</button>
      <button class="tac-b tac-gauche" data-code="ArrowLeft">◀</button>
      <button class="tac-b tac-droite" data-code="ArrowRight">▶</button>
      <button class="tac-b tac-bas"    data-code="ArrowDown">▼</button>
    </div>
    <div class="tac-actions">
      <button class="tac-b tac-bag" data-code="KeyB">B</button>
      <button class="tac-b tac-a"   data-code="Space">A</button>
    </div>
    <button class="tac-b tac-menu" data-code="Escape">≡</button>
  </div>

  <!-- Le menu pause (touche Échap) : sauvegarder / charger -->
  <div class="menu" id="menu" hidden>
    <div class="menu-panneau">
      <h2 class="menu-titre">Paused</h2>
      <button class="menu-continuer" id="menu-reprendre">Resume</button>
      <div class="menu-slots" id="menu-slots"></div>
      <p class="menu-aide">Esc to open / close</p>
    </div>
  </div>

  <!-- L'écran de titre -->
  <main class="ecran-titre" id="ecran-titre">
    <h1 class="titre">BRUTAL</h1>
    <p class="sous-titre">Deep under the mountain</p>

    <button class="bouton" id="bouton-jouer">Play</button>

    <!-- Le choix au démarrage : nouvelle partie ou reprise d'un emplacement -->
    <div class="demarrage" id="demarrage" hidden>
      <button class="menu-continuer" id="demarrage-nouvelle">New Game</button>
      <div class="menu-slots" id="demarrage-slots"></div>
    </div>

    <p class="aide">Move: WASD / ZQSD or arrows &nbsp;·&nbsp; Space: talk / confirm &nbsp;·&nbsp; B: inventory &nbsp;·&nbsp; Esc: menu</p>

    <footer class="pied">v0.9 — steel meets stone</footer>
  </main>

  <script type="module">
    import { demarrerJeu } from "./jeu/principal.js";
    import { installerDemarrage } from "./jeu/ui/demarrage.js";
    import { installerTactile } from "./jeu/ui/tactile.js";

    const ecranTitre = document.getElementById("ecran-titre");
    const canvas = document.getElementById("jeu");
    const hud = document.getElementById("hud");

    // L'écran de démarrage décide : nouvelle partie (null) ou sauvegarde
    installerDemarrage({
      lancer(donnees) {
        ecranTitre.hidden = true;
        canvas.hidden = false;
        hud.hidden = false;
        installerTactile(); // contrôles tactiles si on est sur écran tactile
        demarrerJeu(donnees);
      },
    });
  </script>
</body>
</html>
