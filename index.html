<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRUTAL</title>
  <style>
    /* ---- Réglages de base ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0f;
      color: #f5f5f5;
      overflow: hidden;
    }

    /* Le body centre le canvas du jeu */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- Le canvas du jeu (caché tant qu'on n'a pas cliqué Play) ---- */
    canvas {
      image-rendering: pixelated;   /* pixels nets, jamais de flou */
      background: #14110f;
    }

    [hidden] { display: none !important; }

    /* ---- L'écran de titre, par-dessus tout ---- */
    .ecran-titre {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(220, 38, 38, 0.25), transparent 60%),
        #0a0a0f;
    }

    .titre {
      font-size: clamp(3.5rem, 18vw, 11rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #ff4d4d 55%, #b91c1c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(239, 68, 68, 0.35);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    .sous-titre {
      margin-top: 0.5rem;
      font-size: clamp(0.9rem, 3.5vw, 1.3rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .bouton {
      margin-top: 3rem;
      padding: 1rem 3.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .bouton:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(239, 68, 68, 0.6);
    }

    .bouton:active { transform: translateY(0); }

    .aide {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #6b7280;
      letter-spacing: 0.05em;
    }

    .pied {
      position: absolute;
      bottom: 1.2rem;
      font-size: 0.8rem;
      color: #4b5563;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <!-- L'écran du jeu : 320x180 pixels internes, agrandi sans flou -->
  <canvas id="jeu" width="320" height="180" hidden></canvas>

  <!-- L'écran de titre -->
  <main class="ecran-titre" id="ecran-titre">
    <h1 class="titre">BRUTAL</h1>
    <p class="sous-titre">Deep under the mountain</p>

    <button class="bouton" id="bouton-jouer">Play</button>
    <p class="aide">Move with WASD / ZQSD or arrow keys</p>

    <footer class="pied">v0.2 — first steps</footer>
  </main>

  <script type="module">
    import { demarrerJeu } from "./jeu/principal.js";

    const ecranTitre = document.getElementById("ecran-titre");
    const canvas = document.getElementById("jeu");

    document.getElementById("bouton-jouer").addEventListener(
      "click",
      () => {
        ecranTitre.hidden = true;
        canvas.hidden = false;
        demarrerJeu();
      },
      { once: true } // un seul démarrage
    );
  </script>
</body>
</html>
