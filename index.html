<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRUTAL</title>
  <style>
    /* ---- Réglages de base ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0f;
      color: #f5f5f5;
      overflow: hidden;
    }

    /* Le body centre le canvas du jeu */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- Le canvas du jeu (caché tant qu'on n'a pas cliqué Play) ---- */
    canvas {
      image-rendering: pixelated;   /* pixels nets, jamais de flou */
      background: #14110f;
    }

    [hidden] { display: none !important; }

    /* ---- L'écran de titre, par-dessus tout ---- */
    .ecran-titre {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(220, 38, 38, 0.25), transparent 60%),
        #0a0a0f;
    }

    .titre {
      font-size: clamp(3.5rem, 18vw, 11rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #ff4d4d 55%, #b91c1c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(239, 68, 68, 0.35);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    .sous-titre {
      margin-top: 0.5rem;
      font-size: clamp(0.9rem, 3.5vw, 1.3rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .bouton {
      margin-top: 3rem;
      padding: 1rem 3.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .bouton:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(239, 68, 68, 0.6);
    }

    .bouton:active { transform: translateY(0); }

    .aide {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #6b7280;
      letter-spacing: 0.05em;
    }

    .pied {
      position: absolute;
      bottom: 1.2rem;
      font-size: 0.8rem;
      color: #4b5563;
      letter-spacing: 0.1em;
    }

    /* ---- Le HUD : l'équipement porté, en bas à gauche ---- */
    .hud {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 8px 12px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      color: #e5e7eb;
      background: rgba(10, 10, 15, 0.75);
      border: 1px solid #374151;
      border-radius: 6px;
    }

    /* ---- Le menu pause (touche Échap) ---- */
    .menu {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 8, 0.72);
      z-index: 10;
    }

    .menu-panneau {
      width: min(460px, 92vw);
      padding: 28px 26px 20px;
      background: #14121a;
      border: 1px solid #3b2030;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .menu-titre {
      margin: 0 0 18px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f3f4f6;
    }

    .menu-continuer {
      width: 100%;
      margin-bottom: 18px;
      padding: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .menu-continuer:disabled { opacity: 0.4; cursor: default; }

    .menu-slots { display: flex; flex-direction: column; gap: 10px; }

    .menu-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #1d1b25;
      border: 1px solid #2c2a36;
      border-radius: 8px;
    }

    .menu-slot-info { display: flex; flex-direction: column; text-align: left; }
    .menu-slot-nom { font-weight: 700; font-size: 0.95rem; color: #e5e7eb; }
    .menu-slot-resume {
      white-space: pre-line;
      font-size: 0.76rem;
      line-height: 1.4;
      color: #9ca3af;
    }

    .menu-slot-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .menu-slot-actions button {
      padding: 7px 14px;
      font-weight: 600;
      color: #f3f4f6;
      background: #2f2d3a;
      border: 1px solid #45424f;
      border-radius: 6px;
      cursor: pointer;
    }
    .menu-slot-actions button:hover { background: #3b3947; }
    .menu-slot-actions button:disabled { opacity: 0.35; cursor: default; }

    .menu-aide {
      margin-top: 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    /* ---- Le choix au démarrage (sur l'écran de titre) ---- */
    .demarrage {
      width: min(460px, 92vw);
      margin-top: 2.4rem;
    }

    /* ---- Le flash de combat (façon FF9) ---- */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 18;
    }
    .flash.actif { animation: clignote 0.7s steps(1, end); }

    @keyframes clignote {
      0%   { opacity: 0.95; }
      14%  { opacity: 0; }
      28%  { opacity: 0.95; }
      42%  { opacity: 0; }
      56%  { opacity: 0.85; }
      100% { opacity: 0; }
    }

    /* ---- Les messages furtifs (points d'intérêt, infos de zone) ---- */
    .message-zone {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%) translateY(8px);
      padding: 10px 18px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 14px;
      color: #f3f4f6;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid #4b5563;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 15;
    }
    .message-zone.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- L'écran du jeu : 640x360 pixels internes, agrandi sans flou -->
  <canvas id="jeu" width="640" height="360" hidden></canvas>

  <!-- Le HUD : interface en HTML par-dessus le canvas -->
  <div class="hud" id="hud" hidden>
    <div id="hud-arme"></div>
    <div id="hud-armure"></div>
  </div>

  <!-- Le flash de combat -->
  <div class="flash" id="flash"></div>

  <!-- Les messages furtifs (points d'intérêt…) -->
  <div class="message-zone" id="message-zone"></div>

  <!-- Le menu pause (touche Échap) : sauvegarder / charger -->
  <div class="menu" id="menu" hidden>
    <div class="menu-panneau">
      <h2 class="menu-titre">Paused</h2>
      <button class="menu-continuer" id="menu-reprendre">Resume</button>
      <div class="menu-slots" id="menu-slots"></div>
      <p class="menu-aide">Esc to open / close</p>
    </div>
  </div>

  <!-- L'écran de titre -->
  <main class="ecran-titre" id="ecran-titre">
    <h1 class="titre">BRUTAL</h1>
    <p class="sous-titre">Deep under the mountain</p>

    <button class="bouton" id="bouton-jouer">Play</button>

    <!-- Le choix au démarrage : nouvelle partie ou reprise d'un emplacement -->
    <div class="demarrage" id="demarrage" hidden>
      <button class="menu-continuer" id="demarrage-nouvelle">New Game</button>
      <div class="menu-slots" id="demarrage-slots"></div>
    </div>

    <p class="aide">Move: WASD / ZQSD or arrows &nbsp;·&nbsp; R / E: swap gear &nbsp;·&nbsp; Esc: menu</p>

    <footer class="pied">v0.8 — something stirs in the dark</footer>
  </main>

  <script type="module">
    import { demarrerJeu } from "./jeu/principal.js";
    import { installerDemarrage } from "./jeu/ui/demarrage.js";

    const ecranTitre = document.getElementById("ecran-titre");
    const canvas = document.getElementById("jeu");
    const hud = document.getElementById("hud");

    // L'écran de démarrage décide : nouvelle partie (null) ou sauvegarde
    installerDemarrage({
      lancer(donnees) {
        ecranTitre.hidden = true;
        canvas.hidden = false;
        hud.hidden = false;
        demarrerJeu(donnees);
      },
    });
  </script>
</body>
</html>
