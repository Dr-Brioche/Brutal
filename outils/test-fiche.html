<!doctype html>
<!--
  ⚠ PAGE DE TEST (hors jeu) — À NE PAS EMBARQUER DANS L'EXPORT FINAL.

  Ouvre DIRECTEMENT la fiche de personnage (écran d'inventaire) avec le build
  choisi, sans jouer la partie. Sert à vérifier d'un coup d'œil que les STATS
  affichées et leur ligne de détail (« 100 de base + 50 talents + 100 équipement »)
  disent la vérité — c'est là que le compte doit tomber juste.

  Ouvrir : outils/test-fiche.html (depuis un serveur local, comme le jeu).
-->
<meta charset="utf-8">
<!-- Chemins d'images relatifs à la RACINE (cf. docs/tests.md). -->
<base href="../">
<title>Brütàl — test de la fiche de personnage</title>
<style>
  body { margin: 0; background: #14110d; color: #e8e0cc; font-family: system-ui, sans-serif; }
  #barre { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 10px 14px;
           background: #1e1a14; border-bottom: 1px solid #3a3227; }
  label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; padding: 4px 8px; background: #2a241b; color: #e8e0cc;
                   border: 1px solid #52463433; border-radius: 6px; }
  button { cursor: pointer; background: #6b5426; }
  #etat { font-size: 12px; opacity: .8; margin-left: auto; font-family: ui-monospace, monospace; }
</style>

<div id="barre">
  <label>Bottes
    <select id="sel-bottes">
      <option value="">— aucune —</option>
      <option value="bottes-barbare" selected>Barbarian Boots (+100)</option>
      <option value="bottes-onyx">Onyx Boots (+200)</option>
      <option value="bottes-usees">Worn Boots (+10)</option>
    </select>
  </label>
  <label>Talents d'agilité
    <select id="sel-talents">
      <option value="">— aucun —</option>
      <option value="agile1" selected>Fleet Strikes (+50)</option>
      <option value="artisanat3">Nimble Smith rang 3 (+90)</option>
      <option value="les-deux">Fleet Strikes + Nimble Smith 3 (+140)</option>
    </select>
  </label>
  <label>Langue
    <select id="sel-langue"><option value="fr">Français</option><option value="en">English</option></select>
  </label>
  <button id="go">Ouvrir la fiche</button>
  <button id="go-arbre">Ouvrir l'arbre de talents</button>
  <span id="etat"></span>
</div>

<div id="scene"></div>

<script type="module">
  import { installerInventaire } from "./jeu/ui/inventaire.js";
  import { installerTalents } from "./jeu/ui/talents.js";
  import { creerHeros } from "./jeu/entities/heros.js";
  import { creerInventaire, appliquerEquipement, ajouterObjet } from "./jeu/systems/inventaire.js";
  import { appliquerTalents } from "./jeu/systems/talents.js";
  import { appliquerTextesDOM, definirLangue } from "./jeu/systems/langue.js";
  import { installerLangueDonnees } from "./jeu/systems/i18n_donnees.js";

  const etat = document.getElementById("etat");

  // Récupère le DOM du jeu (panneau d'inventaire + styles) depuis index.html.
  const html = await (await fetch("./index.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  for (const st of doc.querySelectorAll("style")) document.head.append(st.cloneNode(true));
  const scene = document.getElementById("scene");
  for (const el of doc.body.children) {
    if (el.tagName === "SCRIPT") continue;
    scene.append(el.cloneNode(true));
  }
  for (const id of ["ecran-titre", "dbgr-btn", "dbgr-overlay", "barre-menu", "tactile", "cadre-jeu"]) {
    document.getElementById(id)?.remove();
  }

  const TALENTS = {
    "": {},
    agile1: { corps1: 1, corps3: 1, agile1: 1 },
    artisanat3: { artisanat: 3 },
    "les-deux": { corps1: 1, corps3: 1, agile1: 1, artisanat: 3 },
  };

  let ui = null;
  function ouvrir() {
    ui?.fermer();
    definirLangue(document.getElementById("sel-langue").value);
    appliquerTextesDOM();
    installerLangueDonnees();

    const heros = creerHeros();
    heros.niveau = 15;
    heros.talents = { ...TALENTS[document.getElementById("sel-talents").value] };
    appliquerTalents(heros);

    const inventaire = creerInventaire();
    // Quelques objets d'EMPREINTES DIFFÉRENTES (1×1, 1×2, 2×2…) : c'est là qu'un
    // mauvais pas de grille se voit — les gros objets se décalent en premier.
    for (const id of ["epee-courte", "hache-de-guerre", "potion-soin", "fer", "charbon",
                      "bouclier-bois", "anneau-force", "cotte-mailles"]) {
      ajouterObjet(inventaire, id, 1);
    }
    const bottes = document.getElementById("sel-bottes").value;
    if (bottes) inventaire.slots.botte = bottes;
    appliquerEquipement(heros, inventaire, new Map());

    ui = installerInventaire({
      inventaire, heros,
      surChangement: () => {}, surFermer: () => {}, surJeter: () => {},
      surVendre: null, surLire: null,
    });
    ui.ouvrir();
    // Le compte attendu, calculé À PART du code de la fiche : si les deux
    // divergent, c'est la fiche qui ment (c'est tout l'intérêt de la page).
    etat.textContent = `attendu : agilité = 100 + ${heros.agiliteTalent ?? 0} talents + ${heros.agiliteEquip ?? 0} équip.`;
  }
  // L'ARBRE DE TALENTS, avec des points à dépenser : sert à relire les
  // prérequis (qui débloque quoi) sans avoir à monter un personnage en jeu.
  let arbre = null;
  function ouvrirArbre() {
    ui?.fermer(); arbre?.fermer();
    const heros = creerHeros();
    heros.niveau = 30; heros.pointsTalent = 30; heros.talents = {};
    appliquerTalents(heros);
    arbre = installerTalents({ heros, surChangement: () => {}, surFermer: () => {}, surAction: () => {} });
    arbre.ouvrir();
    etat.textContent = "arbre de talents — 30 points à dépenser";
  }
  document.getElementById("go").addEventListener("click", ouvrir);
  document.getElementById("go-arbre").addEventListener("click", ouvrirArbre);
  window.__ouvrirFiche = ouvrir;   // pilotables depuis un script de capture
  window.__ouvrirArbre = ouvrirArbre;
  ouvrir();
</script>
